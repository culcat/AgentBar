[package]
name = "agentbar"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native macOS menu bar monitor and launcher for AI coding agents"
license = "MIT"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
env_logger = "0.11"
log = "0.4"
muda = "0.15"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
tray-icon = "0.19"
